<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="hero">
      <img src="./eisenhower-matrix.jpg">
      <a class="hero__details-link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </div>
    <div class="main">
      <p id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="add-task">
          <input id="new-task" class="add-task__input" type="text">
          <button>Add</button>
        </div>
      </p>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li class="task">
          <input type="checkbox">
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input">
          <button class="button_type_edit">Edit</button>
          <button class="button_type_delete">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="task task_edit-mode">
          <input type="checkbox">
          <label class="task__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task__input">
          <button class="button_type_edit">Save</button>
          <button class="button_type_delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li class="task">
        <input type="checkbox" checked>
        <label class="task__label">See the Doctor</label>
        <input type="text" class="task__input">
        <button class="button_type_edit">Edit</button>
        <button class="button_type_delete">
          <img src="./remove.svg">
        </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
